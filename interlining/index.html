<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>interlining — athoce</title>
    <meta name="description" content="inter-lining — Personal Language, athoce seoul, 2026. 프레스 데이 초대 및 참가 정보 입력." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="https://athoce.kr/interlining" />
    <link rel="icon" type="image/svg+xml" href="/assets/athoce-symbol.svg" />
    <link rel="stylesheet" href="/interlining/styles.css?v=20261013-rent-1" />
    <link rel="stylesheet" href="/assets/forms.css?v=20261013-rent-1" />
    <link rel="stylesheet" href="/interlining/form.css?v=20261013-black-1" />
    <script src="https://t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
    <script src="/interlining/app.js?v=20261013-storage-1" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <a class="brand" href="/" aria-label="athoce home">
          <img src="/assets/athoce-symbol.svg" alt="" width="75" height="44" />
        </a>
      </div>
    </header>
    <main>
      <section class="information" aria-labelledby="pageTitle">
        <img class="invitation-artwork" src="/interlining/assets/invitation.png" alt="" width="1440" height="1080" />
        <p class="invitation">private invitation</p>
        <h1 id="pageTitle">inter-lining</h1>
        <p class="subtitle">Personal Language, athoce seoul, 2026</p>
        <div class="event-information">
          <p>프레스 데이<br /><time datetime="2026-10-23">2026.10.23 (금)</time><br />14:00 ~ 20:00</p>
        </div>
        <form id="interliningForm" class="information-form athoce-form" action="/api/interlining" method="post">
          <div class="field">
            <label for="fullName">성함</label>
            <input id="fullName" name="fullName" type="text" autocomplete="name" maxlength="100" required />
          </div>
          <div class="field">
            <label for="instagram">instagram</label>
            <input id="instagram" name="instagram" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="100" required />
          </div>
          <fieldset class="field phone-field">
            <legend>연락처</legend>
            <div class="phone-inputs">
              <input name="phoneFirst" type="tel" aria-label="연락처 앞자리" inputmode="numeric" autocomplete="tel-area-code" pattern="[0-9]{2,4}" minlength="2" maxlength="4" required />
              <span aria-hidden="true">-</span>
              <input name="phoneMiddle" type="tel" aria-label="연락처 중간자리" inputmode="numeric" autocomplete="tel-local-prefix" pattern="[0-9]{3,4}" minlength="3" maxlength="4" required />
              <span aria-hidden="true">-</span>
              <input name="phoneLast" type="tel" aria-label="연락처 끝자리" inputmode="numeric" autocomplete="tel-local-suffix" pattern="[0-9]{4}" minlength="4" maxlength="4" required />
            </div>
          </fieldset>
          <div class="field address-field">
            <label for="address">주소</label>
            <div class="address-inputs">
              <input id="address" name="address" type="text" autocomplete="address-line1" placeholder="주소" maxlength="300" readonly required />
              <button id="addressSearch" type="button" aria-expanded="false" aria-controls="postcodePanel">주소 검색</button>
            </div>
            <section id="postcodePanel" class="postcode-panel" aria-label="주소 검색" hidden>
              <div class="postcode-toolbar"><button id="addressClose" type="button">닫기</button></div>
              <div id="postcodeSearch" class="postcode-search"></div>
            </section>
            <label class="visually-hidden" for="addressDetail">상세주소</label>
            <input id="addressDetail" name="addressDetail" type="text" autocomplete="address-line2" placeholder="상세주소" maxlength="300" required />
            <label id="postcodeLabel" for="postcode" hidden>우편번호</label>
            <input id="postcode" name="postcode" type="hidden" inputmode="numeric" autocomplete="postal-code" placeholder="우편번호" pattern="[0-9]{5}" maxlength="5" />
          </div>
          <fieldset class="field">
            <legend>동반인원 수</legend>
            <div class="guest-options athoce-form-options">
              <label><input type="radio" name="guests" value="0" required /> 0</label>
              <label><input type="radio" name="guests" value="1" /> 1</label>
              <label><input type="radio" name="guests" value="2" /> 2</label>
              <label><input type="radio" name="guests" value="3" /> 3</label>
              <label><input id="guestsOther" type="radio" name="guests" value="etc" /> 기타</label>
            </div>
            <label class="visually-hidden" for="guestsDetail">동반인원 수 직접입력</label>
            <input id="guestsDetail" name="guestsDetail" type="text" inputmode="numeric" placeholder="직접입력" maxlength="100" hidden disabled />
          </fieldset>
          <fieldset class="field filming-consent">
            <legend>행사 당일 현장 기록을 위한 사진 및 영상 촬영이 진행됩니다. 촬영된 콘텐츠는 향후 아카이브 및 홍보 자료로 활용될 수 있는 점 참고 부탁드립니다.</legend>
            <div class="athoce-form-options"><label><input type="radio" name="filmingConsent" value="동의" required /> 동의</label></div>
          </fieldset>
          <div class="honeypot" aria-hidden="true">
            <label for="website">website</label>
            <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
          </div>
          <div class="form-actions athoce-form-actions">
            <button id="submitButton" type="submit">작성</button>
            <p id="formStatus" class="form-status athoce-form-status" role="status" aria-live="polite"></p>
          </div>
        </form>
        <section id="confirmation" class="confirmation" aria-labelledby="confirmationTitle" hidden tabindex="-1">
          <h2 id="confirmationTitle">정상적으로 접수되었습니다.</h2>
          <a class="athoce-form-link" href="https://personal-language.kr/product/list.html?cate_no=46">Personal Language - 'A STAGE"</a>
        </section>
        <noscript><p class="form-status">주소 검색과 제출을 위해 JavaScript를 켜 주세요.</p></noscript>
      </section>
    </main>
  </body>
</html>
